  { source: 'swan', target: 'israel', type: 'advisory', label: 'Intel/Mobileye acquisition ($15.3B)' },
  { source: 'scaparrotti', target: 'turkey', type: 'advisory', label: 'SACEUR; F-35/S-400 testimony' },
  { source: 'flag_fara', target: 'saudi', type: 'legal', label: 'NTI advisory = potential FARA trigger' },
  { source: 'flag_fara', target: 'uae', type: 'legal', label: 'NTI advisory = potential FARA trigger' },
];

// ─── CANVAS ENGINE ───────────────────────────────────────────────────────────

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
let transform = { x: 0, y: 0, scale: 1 };
let dragging = null;
let dragOffset = { x: 0, y: 0 };
let panning = false;
let panStart = { x: 0, y: 0 };
let panOrigin = { x: 0, y: 0 };
let frozen = false;
let hoveredNode = null;
let selectedNode = null;
let animFrame = null;
let searchQuery = '';
let highlightSet = null;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { resize(); draw(); });
resize();

// ─── LAYOUT ──────────────────────────────────────────────────────────────────

// Assign positions - place them in rough sectors
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

// Initial placement by type
const typeSeeds = {
  company: { cx: W * 0.35, cy: H * 0.45 },
  person:  { cx: W * 0.5,  cy: H * 0.45 },
  govt:    { cx: W * 0.65, cy: H * 0.35 },
  thinktank: { cx: W * 0.25, cy: H * 0.35 },
  vc:      { cx: W * 0.6,  cy: H * 0.6 },
  foreign: { cx: W * 0.3,  cy: H * 0.7 },
  legal:   { cx: W * 0.55, cy: H * 0.75 },
};
const typeCounters = {};
nodes.forEach(n => {
  const seed = typeSeeds[n.type] || { cx: W*0.5, cy: H*0.5 };
  const count = typeCounters[n.type] = (typeCounters[n.type] || 0) + 1;
  const angle = (count * 2.399); // golden angle
  const r = 80 + count * 28;
  n.x = seed.cx + Math.cos(angle) * r;
  n.y = seed.cy + Math.sin(angle) * r;
  n.vx = 0; n.vy = 0;
});

// ─── FORCE SIMULATION ────────────────────────────────────────────────────────

const SIM_ALPHA_START = 0.8;
let alpha = SIM_ALPHA_START;

function simulate() {
  if (frozen || alpha < 0.001) return;
  alpha *= 0.985;

  const repulsion = 3200;
  const linkDist = 160;
  const linkStrength = 0.12;
  const centerForce = 0.004;
  const damping = 0.7;

  // repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const minDist = a.radius + b.radius + 20;
      if (dist < minDist * 3) {
        const force = repulsion / (dist * dist) * alpha;
        const fx = dx / dist * force, fy = dy / dist * force;
        a.vx -= fx; a.vy -= fy;
        b.vx += fx; b.vy += fy;
      }
    }
  }

  // link attraction
  links.forEach(link => {
    const src = nodeMap[link.source], tgt = nodeMap[link.target];
    if (!src || !tgt) return;
    let dx = tgt.x - src.x, dy = tgt.y - src.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const force = (dist - linkDist) * linkStrength * alpha;
    const fx = dx / dist * force, fy = dy / dist * force;
    if (!src.pinned) { src.vx += fx; src.vy += fy; }
    if (!tgt.pinned) { tgt.vx -= fx; tgt.vy -= fy; }
  });

  // center
  const cx = W / 2, cy = H / 2;
  nodes.forEach(n => {
    if (!n.pinned) {
      n.vx += (cx - n.x) * centerForce * alpha;
      n.vy += (cy - n.y) * centerForce * alpha;
      n.vx *= damping; n.vy *= damping;
      n.x += n.vx; n.y += n.vy;
    }
  });
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────

function screenToWorld(sx, sy) {
  return { x: (sx - transform.x) / transform.scale, y: (sy - transform.y) / transform.scale };
}

function isHighlighted(n) {
  if (!highlightSet) return true;
  return highlightSet.has(n.id);
}

function drawArrow(x1, y1, x2, y2, color, width, dash, srcR, tgtR) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  // trim to node edges
  const x1t = x1 + (dx/len)*srcR, y1t = y1 + (dy/len)*srcR;
  const x2t = x2 - (dx/len)*(tgtR+8), y2t = y2 - (dy/len)*(tgtR+8);

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash(dash);
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(x1t, y1t);
  ctx.lineTo(x2t, y2t);
  ctx.stroke();
  // arrowhead
  ctx.globalAlpha = 0.7;
  ctx.setLineDash([]);
  ctx.beginPath();
  const angle = Math.atan2(y2t - y1t, x2t - x1t);
  ctx.moveTo(x2t, y2t);
  ctx.lineTo(x2t - 9 * Math.cos(angle - 0.4), y2t - 9 * Math.sin(angle - 0.4));
  ctx.lineTo(x2t - 9 * Math.cos(angle + 0.4), y2t - 9 * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawNode(n) {
  const type = NODE_TYPES[n.type];
  const isSelected = selectedNode && selectedNode.id === n.id;
  const isHovered = hoveredNode && hoveredNode.id === n.id;
  const hl = isHighlighted(n);
  const alpha = hl ? 1 : 0.25;

  ctx.save();
  ctx.globalAlpha = alpha;

  // glow for selected/hovered
  if (isSelected || isHovered) {
    ctx.shadowColor = type.color;
    ctx.shadowBlur = 22;
  }

  // circle
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(n.x - n.radius*0.3, n.y - n.radius*0.3, 1, n.x, n.y, n.radius);
  grad.addColorStop(0, type.borderColor + '40');
  grad.addColorStop(1, type.color + '25');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.lineWidth = isSelected ? 2.5 : (isHovered ? 2 : 1.5);
  ctx.strokeStyle = isSelected ? type.borderColor : type.color;
  ctx.stroke();

  ctx.shadowBlur = 0;

  // label
  ctx.fillStyle = hl ? '#e6edf3' : '#8b949e';
  ctx.font = `${Math.max(9, Math.min(12, n.radius * 0.52))}px -apple-system, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const lines = n.label.split('\n');
  const lh = 13;
  lines.forEach((line, i) => {
    ctx.fillText(line, n.x, n.y + (i - (lines.length - 1) / 2) * lh);
  });

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.scale, transform.scale);

  // edges
  links.forEach(link => {
    const src = nodeMap[link.source], tgt = nodeMap[link.target];
    if (!src || !tgt) return;
    const et = EDGE_TYPES[link.type] || EDGE_TYPES.advisory;
    const srcHl = isHighlighted(src), tgtHl = isHighlighted(tgt);
    const visible = !highlightSet || (srcHl && tgtHl);
    ctx.globalAlpha = visible ? 1 : 0.08;
    drawArrow(src.x, src.y, tgt.x, tgt.y, et.color, et.width, et.dash, src.radius, tgt.radius);
    ctx.globalAlpha = 1;
  });

  // nodes
  nodes.forEach(drawNode);

  ctx.restore();
}

function loop() {
  simulate();
  draw();
  animFrame = requestAnimationFrame(loop);
}
loop();

// ─── INTERACTION ─────────────────────────────────────────────────────────────

function getNodeAt(sx, sy) {
  const w = screenToWorld(sx, sy);
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = n.x - w.x, dy = n.y - w.y;
    if (Math.sqrt(dx*dx + dy*dy) <= n.radius + 4) return n;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const node = getNodeAt(e.clientX, e.clientY);
  if (node) {
    dragging = node;
    node.pinned = true;
    const w = screenToWorld(e.clientX, e.clientY);
    dragOffset.x = node.x - w.x;
    dragOffset.y = node.y - w.y;
    alpha = 0.3;
  } else {
    panning = true;
    panStart.x = e.clientX; panStart.y = e.clientY;
    panOrigin.x = transform.x; panOrigin.y = transform.y;
  }
});

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    const w = screenToWorld(e.clientX, e.clientY);
    dragging.x = w.x + dragOffset.x;
    dragging.y = w.y + dragOffset.y;
    dragging.vx = 0; dragging.vy = 0;
  } else if (panning) {
    transform.x = panOrigin.x + (e.clientX - panStart.x);
    transform.y = panOrigin.y + (e.clientY - panStart.y);
  } else {
    const node = getNodeAt(e.clientX, e.clientY);
    hoveredNode = node;
    canvas.style.cursor = node ? 'pointer' : 'grab';
    // tooltip
    const tt = document.getElementById('tooltip');
    if (node) {
      tt.style.display = 'block';
      tt.style.left = (e.clientX + 14) + 'px';
      tt.style.top = (e.clientY - 10) + 'px';
      const et = NODE_TYPES[node.type];
      tt.innerHTML = `<strong style="color:${et.color}">${node.label.replace('\n', ' ')}</strong><br>${node.detail.type}`;
      if (node.detail.flags && node.detail.flags.length) {
        tt.innerHTML += `<br><span style="color:#ff6b6b;font-size:0.68rem">⚠ ${node.detail.flags.length} flag(s)</span>`;
      }
    } else {
      tt.style.display = 'none';
    }
  }
});

canvas.addEventListener('mouseup', e => {
  if (dragging) {
    dragging.pinned = false;
    dragging = null;
  }
  panning = false;
});

canvas.addEventListener('click', e => {
  const node = getNodeAt(e.clientX, e.clientY);
  if (node) {
    selectNode(node);
  } else {
    clearSelection();
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const scaleBy = e.deltaY < 0 ? 1.1 : 0.9;
  const mx = e.clientX, my = e.clientY;
  transform.x = mx - (mx - transform.x) * scaleBy;
  transform.y = my - (my - transform.y) * scaleBy;
  transform.scale = Math.max(0.15, Math.min(5, transform.scale * scaleBy));
}, { passive: false });

// ─── SELECTION & PANEL ───────────────────────────────────────────────────────

function selectNode(node) {
  selectedNode = node;
  alpha = 0.2;
  // build highlight set: the node + all directly connected nodes + their edges
  const set = new Set([node.id]);
  links.forEach(l => {
    if (l.source === node.id) set.add(l.target);
    if (l.target === node.id) set.add(l.source);
  });
  highlightSet = set;
  renderPanel(node);
}

function clearSelection() {
  selectedNode = null;
  highlightSet = null;
  document.getElementById('info-panel').classList.remove('open');
}

function renderPanel(node) {
  const panel = document.getElementById('info-panel');
  const content = document.getElementById('panel-content');
  const type = NODE_TYPES[node.type];

  // connected nodes
  const connected = [];
  links.forEach(l => {
    if (l.source === node.id) {
      const t = nodeMap[l.target];
      if (t) connected.push({ node: t, edge: l, dir: 'out' });
    }
    if (l.target === node.id) {
      const s = nodeMap[l.source];
      if (s) connected.push({ node: s, edge: l, dir: 'in' });
    }
  });

  let html = `<button id="close-panel" onclick="clearSelection()">✕</button>
  <h2>${node.detail.title}</h2>
  <span class="node-type" style="background:${type.color}22;color:${type.color};border:1px solid ${type.color}44">${node.detail.type}</span>`;

  if (node.detail.facts && node.detail.facts.length) {
    html += `<div class="detail-block"><h3>Key Facts</h3>`;
    node.detail.facts.forEach(f => { html += `<div style="margin-bottom:4px">• ${f}</div>`; });
    html += `</div>`;
  }

  if (node.detail.flags && node.detail.flags.length) {
    html += `<div class="detail-block" style="border-color:#ff6b6b44"><h3 style="color:#ff6b6b">Legal / Risk Flags</h3>`;
    node.detail.flags.forEach(f => { html += `<div class="flag">${f}</div>`; });
    html += `</div>`;
  }

  if (connected.length) {
    html += `<div class="connections"><h3>Connected Nodes (${connected.length})</h3><ul>`;
    connected.sort((a,b) => a.node.label.localeCompare(b.node.label)).forEach(c => {
      const et = EDGE_TYPES[c.edge.type] || EDGE_TYPES.advisory;
      const arrow = c.dir === 'out' ? '→' : '←';
      html += `<li onclick="selectNode(nodeMap['${c.node.id}'])">
        <span style="color:${et.color}">${arrow}</span>
        <strong style="color:${NODE_TYPES[c.node.type].color}">${c.node.label.replace('\n',' ')}</strong>
        <span style="color:#484f58;font-size:0.68rem"> (${c.edge.label})</span>
      </li>`;
    });
    html += `</ul></div>`;
  }

  content.innerHTML = html;
  panel.classList.add('open');
}

// ─── CONTROLS ─────────────────────────────────────────────────────────────────

document.getElementById('btn-zoom-in').onclick = () => {
  transform.scale = Math.min(5, transform.scale * 1.2);
  transform.x = W/2 - (W/2 - transform.x) * 1.2;
  transform.y = H/2 - (H/2 - transform.y) * 1.2;
};
document.getElementById('btn-zoom-out').onclick = () => {
  transform.scale = Math.max(0.15, transform.scale / 1.2);
  transform.x = W/2 - (W/2 - transform.x) / 1.2;
  transform.y = H/2 - (H/2 - transform.y) / 1.2;
};
document.getElementById('btn-reset').onclick = () => {
  transform = { x: 0, y: 0, scale: 1 };
  clearSelection();
};
document.getElementById('btn-freeze').onclick = function() {
  frozen = !frozen;
  this.style.background = frozen ? '#21262d' : '';
  this.style.color = frozen ? '#79c0ff' : '';
};

// ─── SEARCH ───────────────────────────────────────────────────────────────────

document.getElementById('search-bar').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  searchQuery = q;
  if (!q) {
    highlightSet = null;
    selectedNode = null;
    return;
  }
  const matches = nodes.filter(n =>
    n.label.toLowerCase().includes(q) ||
    n.detail.title.toLowerCase().includes(q) ||
    n.detail.type.toLowerCase().includes(q) ||
    (n.detail.facts || []).some(f => f.toLowerCase().includes(q)) ||
    (n.detail.flags || []).some(f => f.toLowerCase().includes(q))
  );
  if (matches.length === 1) {
    selectNode(matches[0]);
  } else if (matches.length > 0) {
    const set = new Set(matches.map(n => n.id));
    links.forEach(l => {
      if (set.has(l.source) && set.has(l.target)) {
        set.add(l.source); set.add(l.target);
      }
    });
    highlightSet = set;
    selectedNode = null;
  }
});

// legend filter
document.querySelectorAll('.legend-item').forEach(el => {
  el.addEventListener('click', function() {
    const type = this.dataset.type;
    const typeNodes = nodes.filter(n => n.type === type);
    if (!typeNodes.length) return;
    if (typeNodes.every(n => highlightSet && highlightSet.has(n.id))) {
      highlightSet = null; selectedNode = null;
    } else {
      const set = new Set(typeNodes.map(n => n.id));
      links.forEach(l => { if (set.has(l.source)) set.add(l.target); if (set.has(l.target)) set.add(l.source); });
      highlightSet = set; selectedNode = null;
    }
  });
});

// ─── TOUCH ────────────────────────────────────────────────────────────────────
let lastTouchDist = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) lastTouchDist = null;
  else if (e.touches.length === 1) {
    const t = e.touches[0];
    const node = getNodeAt(t.clientX, t.clientY);
    if (node) { dragging = node; node.pinned = true; const w = screenToWorld(t.clientX, t.clientY); dragOffset.x = node.x - w.x; dragOffset.y = node.y - w.y; alpha = 0.3; }
    else { panning = true; panStart.x = t.clientX; panStart.y = t.clientY; panOrigin.x = transform.x; panOrigin.y = transform.y; }
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (lastTouchDist) { const s = dist / lastTouchDist; transform.scale = Math.max(0.15, Math.min(5, transform.scale * s)); }
    lastTouchDist = dist;
  } else if (e.touches.length === 1) {
    const t = e.touches[0];
    if (dragging) { const w = screenToWorld(t.clientX, t.clientY); dragging.x = w.x + dragOffset.x; dragging.y = w.y + dragOffset.y; dragging.vx = 0; dragging.vy = 0; }
    else if (panning) { transform.x = panOrigin.x + (t.clientX - panStart.x); transform.y = panOrigin.y + (t.clientY - panStart.y); }
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { if (dragging) { dragging.pinned = false; dragging = null; } panning = false; });
</script>
</body>
</html>
